<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>상품 미리보기</title>
    <style>
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card {
            border: 1px solid #ccc;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            background: #fff;
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .card-body {
            padding: 15px;
        }
        .card-body h3 {
            margin: 0;
            font-size: 18px;
        }
        .card-body p {
            margin: 5px 0;
            color: #777;
        }
    </style>
</head>
<body>

<div class="grid">
    <div class="card" th:each="item : ${productList}">
        <img th:src="@{${item.productImage}}" alt="상품 이미지" />
        <div class="card-body">
            <p th:text="${item.categoryName}">카테고리</p>
            <h3 th:text="${item.productName}">상품명</h3>
            <p th:text="${#numbers.formatInteger(item.productPrice, 3, 'COMMA')} + '원'">가격</p>
            <p th:text="${item.createdAt}">게시일</p>
        </div>
    </div>
</div>

</body>
</html>
